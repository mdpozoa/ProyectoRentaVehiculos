      - name: 🔑 Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🐳 Login ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: 🔨 Build & Push
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/auth-service:${{ github.sha }} \
                       -t ${{ env.ACR_NAME }}.azurecr.io/auth-service:latest \
                       ./services/auth-service
          docker push ${{ env.ACR_NAME }}.azurecr.io/auth-service:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/auth-service:latest

      - name: 🚀 Deploy
        run: |
          az containerapp update \
