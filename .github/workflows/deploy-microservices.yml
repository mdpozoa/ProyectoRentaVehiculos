            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/auth-service:${{ github.sha }}
          echo "✅ auth-service desplegado!"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB: org-service
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-org:
    name: 🏢 org-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login Azure
        uses: azure/login@v2
        with:
