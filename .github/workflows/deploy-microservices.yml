          docker push ${{ env.ACR_NAME }}.azurecr.io/operaciones-service:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/operaciones-service:latest

      - name: 🚀 Deploy
        run: |
          az containerapp update \
            --name operaciones-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/operaciones-service:${{ github.sha }}
          echo "✅ operaciones-service desplegado!"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB: auth-service
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-auth:
    name: 🔐 auth-service
    runs-on: ubuntu-latest
    steps:
