name: 🚀 Deploy Frontend (Vue + Nginx)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'nginx/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:   # Permite lanzarlo manualmente desde GitHub

env:
  ACR_NAME:         zenithdrivemateo
  RESOURCE_GROUP:   zenithdrive-rg
  CONTAINER_APP:    nginx-frontend
  IMAGE_NAME:       nginx-frontend

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      # 2. Login en Azure
      - name: 🔑 Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login en Azure Container Registry
      - name: 🐳 Login en ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # 4. Build de la imagen Docker (Nginx + Vue build dentro del contenedor)
      - name: 🔨 Build imagen Docker
        run: |
          docker build \
            -f Dockerfile.nginx.containerapp \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .

      # 5. Push de la imagen al ACR
      - name: 📤 Push imagen al ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # 6. Actualizar la Container App con la nueva imagen
      - name: 🚀 Deploy a Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 7. Verificar que esté corriendo
      - name: ✅ Verificar deployment
        run: |
          az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" \
            -o tsv
          echo "✅ Frontend desplegado exitosamente!"
