name: 🚀 Deploy Frontend (Vue + Nginx)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'nginx/**'
      - 'Dockerfile.nginx*'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  ACR_NAME:         zenithdrivemateo
  RESOURCE_GROUP:   zenithdrive-rg
  CONTAINER_APP:    nginx-frontend
  IMAGE_NAME:       nginx-frontend

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🐳 Login en ACR
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)
          CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)
          docker login ${{ env.ACR_NAME }}.azurecr.io -u "$CLIENT_ID" -p "$CLIENT_SECRET"

      - name: 🔨 Build imagen Docker
        run: |
          docker build \
            -f Dockerfile.nginx.containerapp \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .

      - name: 📤 Push imagen al ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: 🚀 Deploy a Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
