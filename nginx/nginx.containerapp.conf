upstream auth-service          { server auth-service:80; }
upstream inventario-service    { server inventario-service:80; }
upstream org-service           { server org-service:80; }
upstream operaciones-service   { server operaciones-service:80; }
upstream financiero-service    { server financiero-service:80; }
upstream mantenimiento-service { server mantenimiento-service:80; }
upstream bus-service           { server bus-service:80; }

server {
    listen 80;

    # ── Frontend Angular (SPA) ────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Evitar cache en el HTML para que las actualizaciones se apliquen inmediatamente
        if ($uri = '/index.html') {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }

    # ── Health del gateway ────────────────────────────────────────────────────
    location = /health {
        return 200 '{"gateway":"nginx","status":"ok","version":"2.0"}';
        add_header Content-Type application/json;
    }

    # ── API health (alias) ─────────────────────────────────────────────────────
    location = /api/health {
        return 200 '{"gateway":"nginx","status":"ok","version":"2.0"}';
        add_header Content-Type application/json;
    }
    # ── API root placeholder ───────────────────────────────────────────────────
    location ~ ^/api/?$ {
        return 200 '{"gateway":"nginx","status":"ok","message":"API Gateway activo. Usa /api/v1/... para los endpoints."}';
        add_header Content-Type application/json;
    }

    # ── auth-service ──────────────────────────────────────────────────────────
    location /api/v1/auth {
        rewrite ^/api/v1/auth(.*)$ /api/v1/mateodavid/auth$1 break;
        proxy_pass http://auth-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/usuarios {
        rewrite ^/api/v1/usuarios(.*)$ /api/v1/mateodavid/usuarios$1 break;
        proxy_pass http://auth-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── inventario-service ────────────────────────────────────────────────────
    location /api/v1/vehiculos {
        rewrite ^/api/v1/vehiculos(.*)$ /api/v1/mateodavid/vehiculos$1 break;
        proxy_pass http://inventario-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(marcas|modelos|categorias|extras|tipos-combustible|tipos-transmision|estados-vehiculo)(/.+)?$ {
        rewrite ^/api/v1/(.*)$ /api/v1/mateodavid/$1 break;
        proxy_pass http://inventario-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── org-service ───────────────────────────────────────────────────────────
    location ~ ^/api/v1/(empresas|agencias|provincias|ciudades)(/.+)?$ {
        rewrite ^/api/v1/(.*)$ /api/v1/mateodavid/$1 break;
        proxy_pass http://org-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── operaciones-service ───────────────────────────────────────────────────
    location = /api/v1/reservas/booking {
        rewrite ^/api/v1/reservas/booking$ /api/v1/mateodavid/reservas/booking break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/reservas/booking/ {
        rewrite ^/api/v1/reservas/booking/(.*)$ /api/v1/mateodavid/reservas/booking/$1 break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/alquileres/booking {
        rewrite ^/api/v1/alquileres/booking$ /api/v1/mateodavid/alquileres/booking break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/devoluciones/booking {
        rewrite ^/api/v1/devoluciones/booking$ /api/v1/mateodavid/devoluciones/booking break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/reservas {
        rewrite ^/api/v1/reservas(.*)$ /api/v1/mateodavid/reservas$1 break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/alquileres {
        rewrite ^/api/v1/alquileres(.*)$ /api/v1/mateodavid/alquileres$1 break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/devoluciones {
        rewrite ^/api/v1/devoluciones(.*)$ /api/v1/mateodavid/devoluciones$1 break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin {
        rewrite ^/api/v1/admin(.*)$ /api/v1/mateodavid/admin$1 break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(seguros|tarifas|canales-venta|historial|outbox-events)(/.+)?$ {
        rewrite ^/api/v1/(.*)$ /api/v1/mateodavid/$1 break;
        proxy_pass http://operaciones-service;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── financiero-service ────────────────────────────────────────────────────
    location ~ ^/api/v1/(pagos|facturas)(/.+)?$ {
        rewrite ^/api/v1/(.*)$ /api/v1/mateodavid/$1 break;
        proxy_pass http://financiero-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── mantenimiento-service ─────────────────────────────────────────────────
    location ~ ^/api/v1/(mantenimientos|kardex|sistemas-externos)(/.+)?$ {
        rewrite ^/api/v1/(.*)$ /api/v1/mateodavid/$1 break;
        proxy_pass http://mantenimiento-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── bus-service ───────────────────────────────────────────────────────────
    location /api/v1/bus {
        rewrite ^/api/v1/bus(.*)$ /api/v1/mateodavid/bus$1 break;
        proxy_pass http://bus-service;


        

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
