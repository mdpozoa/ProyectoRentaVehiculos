syntax = "proto3";

package zenith.auth.v1;

// ═══════════════════════════════════════════════════════════════════════════════
// AuthService — gRPC expuesto por auth-service (puerto 4001)
// Consumido por: todos los microservicios (reemplaza validación JWT local)
// ═══════════════════════════════════════════════════════════════════════════════
service AuthService {

  // Valida un Bearer token JWT y retorna el perfil del usuario autenticado.
  // Reemplaza la validación JWT duplicada en cada microservicio.
  rpc ValidateToken (ValidateTokenRequest)
      returns (ValidateTokenResponse);

  // Verifica si un usuario tiene un permiso o rol específico.
  rpc CheckPermission (CheckPermissionRequest)
      returns (CheckPermissionResponse);

  // Retorna el perfil completo del usuario autenticado.
  rpc GetUserProfile (GetUserProfileRequest)
      returns (GetUserProfileResponse);
}

// ── ValidateToken ─────────────────────────────────────────────────────────────

message ValidateTokenRequest {
  string bearer_token = 1;  // Token sin el prefijo "Bearer "
}

message ValidateTokenResponse {
  bool   valid      = 1;
  string user_id    = 2;
  string email      = 3;
  string rol        = 4;   // ADMIN | CLIENTE
  int64  expires_at = 5;   // Unix timestamp (seconds)
  string mensaje    = 6;   // Mensaje de error si !valid
}

// ── CheckPermission ───────────────────────────────────────────────────────────

message CheckPermissionRequest {
  string user_id    = 1;
  string permission = 2;  // e.g. "ADMIN", "MANAGE_VEHICULOS", "CREAR_RESERVA"
}

message CheckPermissionResponse {
  bool   allowed = 1;
  string rol     = 2;
  string mensaje = 3;
}

// ── GetUserProfile ────────────────────────────────────────────────────────────

message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  bool   found     = 1;
  string id        = 2;
  string email     = 3;
  string nombre    = 4;
  string rol       = 5;
  bool   is_active = 6;
  string created_at = 7;
}
